<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Option C, margin notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #1c1b1f;
        --panel: #232227;
        --text: #ece7e1;
        --muted: #a39e97;
        --faint: #6f6b66;
        --line: #34323a;
        --node: #26252a;
        --node-line: #57545c;
        --edge: #7b7781;
        --design: #9fb7d9;
        --problem: #f2777a;
        --heat: #d9b26f;
        --font: "Instrument Sans", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 var(--font);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 28px;
        align-items: baseline;
        padding: 20px 28px 16px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      header .pr {
        color: var(--muted);
        font-size: 14px;
      }
      .checks {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        font-size: 13.5px;
        color: var(--muted);
        margin-left: auto;
      }
      .checks .failed {
        color: var(--problem);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 400px;
        min-height: calc(100vh - 66px);
      }
      .stage {
        padding: 20px 24px;
        position: sticky;
        top: 0;
        align-self: start;
      }
      .stage svg {
        display: block;
        width: 100%;
        max-width: calc(var(--natural-width) * 1.15);
        max-height: calc(100vh - 110px);
        height: auto;
        margin: 0 auto;
      }
      .notes {
        border-left: 1px solid var(--line);
        padding: 8px 0 60px;
      }
      .group {
        padding: 18px 26px 6px;
      }
      .group h2 {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--muted);
        margin: 0 0 4px;
      }
      .group .answer {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      .note {
        all: unset;
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 10px;
        padding: 8px 10px;
        margin: 0 -10px 4px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        color: var(--muted);
      }
      .note b {
        color: var(--text);
        font-weight: 600;
      }
      .note:hover,
      .note.on {
        background: var(--panel);
      }
      .note:focus-visible {
        outline: 2px solid var(--design);
      }
      .pin {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--bg);
        background: var(--design);
      }
      .note.problem .pin {
        background: var(--problem);
      }
      .note.heat .pin {
        background: var(--heat);
      }
      .note p {
        margin: 0;
      }
      .note .more {
        margin-top: 6px;
      }
      .note ol {
        margin: 6px 0 0;
        padding-left: 20px;
      }
      .note ol li.untested {
        color: var(--problem);
      }
      .quiet {
        padding: 0 26px;
        color: var(--faint);
        font-size: 13.5px;
      }

      .diagram {
        font-family: var(--font);
      }
      .shape {
        fill: var(--node);
        stroke: var(--node-line);
        stroke-width: 1.1;
      }
      .shape-line {
        fill: none;
        stroke: var(--node-line);
      }
      .shape-dot {
        fill: var(--node-line);
      }
      .node-kind,
      .node-tech {
        fill: var(--muted);
        font-size: 11px;
      }
      .node-name {
        fill: var(--text);
        font-size: 13.5px;
        font-weight: 600;
      }
      .external .shape {
        fill: none;
        stroke-dasharray: 3 3;
      }
      .boundary-box {
        fill: none;
        stroke: var(--line);
        stroke-width: 1.5;
      }
      .boundary-name {
        fill: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      .edge-line {
        fill: none;
        stroke: var(--edge);
        stroke-width: 1.1;
      }
      .edge-head {
        fill: var(--edge);
      }
      .edge-label text {
        fill: var(--faint);
        font-size: 10.5px;
      }
      .node.added .shape {
        stroke: var(--design);
        stroke-width: 1.6;
      }
      .edge.added .edge-line {
        stroke: var(--design);
      }
      .edge.added .edge-head {
        fill: var(--design);
      }
      .edge.drift .edge-line {
        stroke: var(--problem);
        stroke-width: 1.8;
        stroke-dasharray: 5 4;
      }
      .edge.drift .edge-head {
        fill: var(--problem);
      }
      .edge-label.drift text {
        fill: var(--problem);
      }
      .node.unbuilt .shape {
        fill: none;
        stroke-dasharray: 4 4;
      }
      .node.unbuilt text {
        opacity: 0.5;
      }
      .heat-track {
        fill: var(--line);
      }
      .heat-bar {
        fill: var(--heat);
      }
      .heat-figure {
        fill: var(--heat);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .map-pin circle {
        fill: var(--design);
      }
      .map-pin.problem circle {
        fill: var(--problem);
      }
      .map-pin.heat circle {
        fill: var(--heat);
      }
      .map-pin text {
        fill: var(--bg);
        font-size: 11px;
        font-weight: 700;
      }
      .edge.step .edge-line {
        stroke: var(--text);
        stroke-width: 1.8;
      }
      .edge.step .edge-head {
        fill: var(--text);
      }
      .edge.step.untested .edge-line {
        stroke: var(--problem);
        stroke-dasharray: 3 4;
      }
      .edge.step.untested .edge-head {
        fill: var(--problem);
      }
      svg.focusing .node:not(.lit),
      svg.focusing .edge:not(.lit),
      svg.focusing .edge-label:not(.lit),
      svg.focusing .map-pin:not(.lit) {
        opacity: 0.18;
      }
      svg .node,
      svg .edge,
      svg .edge-label,
      svg .map-pin {
        transition: opacity 0.2s;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .stage {
          position: static;
          padding: 8px;
        }
        .notes {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        .checks {
          margin-left: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        svg .node,
        svg .edge,
        svg .edge-label,
        svg .map-pin {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Share a basket by email</h1>
      <span class="pr">#42, share-a-basket at 3f9c2e1</span>
      <div class="checks" id="checks"></div>
    </header>
    <div class="layout">
      <div class="stage" id="stage"></div>
      <div class="notes" id="notes"></div>
    </div>

    <script src="data.js"></script>
    <script src="diagram.js"></script>
    <script>
      const P = window.PAGE,
        M = P.mock;
      const $ = (id) => document.getElementById(id);
      const add = (parent, tag, text, cls) => {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        if (cls) n.className = cls;
        parent.appendChild(n);
        return n;
      };
      for (const c of M.checks)
        add(
          $("checks"),
          "span",
          `${c.name} ${c.status === "passed" ? "passes" : c.status === "failed" ? "fails" : "flagged"}`,
          c.status,
        );

      const level = P.levels.find((l) => l.id === "basketApi");
      const edgeId = (s, d) => level.edges.find((e) => e.source === s && e.destination === d)?.id;
      const view = P.views.find((v) => v.id === "req-5");
      const trace = M.traces["req-5"];
      const total =
        Object.values(M.code).reduce((s, c) => s + c.added + c.removed, 0) +
        M.outside.reduce((s, f) => s + f[1] + f[2], 0);
      const share = (id) => Math.round((100 * (M.code[id].added + M.code[id].removed)) / total);

      // The notes, in reading order. Each points at what it's about on the diagram.
      const groups = [
        {
          q: "Did the target change?",
          a: "Yes, and merging approves it.",
          notes: [
            {
              tone: "design",
              nodes: ["basketSharing"],
              edges: ["e10", "e11", "e12"],
              title: "Basket sharing is added",
              text: "Shares a shopper's priced basket by email.",
            },
            {
              tone: "design",
              nodes: ["emailOutbox"],
              edges: ["e13", "e14"],
              title: "Email outbox is added",
              text: "Queues emails in the database and sends them on a schedule, so a slow provider can't hold up the basket API. Designed, but no code yet.",
              more: M.adr.path,
            },
            {
              tone: "design",
              nodes: ["emailProvider"],
              edges: ["e14"],
              title: "Email provider is a new external system",
              text: "Basket now depends on it, on the system context too.",
            },
          ],
        },
        {
          q: "Where did the code change?",
          a: "Mostly in Basket sharing.",
          notes: [
            {
              tone: "heat",
              nodes: ["basketSharing"],
              title: `Basket sharing, +184 −0`,
              text: `${share("basketSharing")}% of the PR's code, in 3 new files.`,
            },
            {
              tone: "heat",
              nodes: ["basketController", "basketService", "basketRepository"],
              title: "Small changes to three components",
              text: "Basket controller +38 −6, Basket service +12 −2, Basket repository +3 −1.",
            },
            {
              tone: "problem",
              nodes: [],
              title: "46 lines outside the model",
              text: "src/basket-api/utils/email-template.ts is in no component's folder. Move it into Basket sharing, or give it a component.",
            },
          ],
        },
        {
          q: "Does the as-built match the target?",
          a: "No: one relationship the target doesn't declare.",
          notes: [
            {
              tone: "problem",
              nodes: ["basketController", "basketRepository"],
              edges: ["d0"],
              title: "The controller imports the repository",
              text: M.driftAdvice.d0,
            },
          ],
        },
        {
          q: "Do the tests take the dynamic views?",
          a: "Partly: #5 stops before the outbox.",
          notes: [
            {
              tone: "problem",
              nodes: [...new Set(view.steps.flatMap((s) => [s.source, s.destination]))],
              view: true,
              title: "#5 Share the basket by email",
              text: trace.note,
              steps: true,
            },
          ],
        },
      ];
      let n = 0;
      for (const g of groups) for (const note of g.notes) note.n = ++n;

      let active = null;
      function drawStage() {
        const lit = active?.nodes ?? [];
        const viewEdges = new Map();
        if (active?.view)
          for (const s of view.steps) {
            const id = edgeId(s.source, s.destination);
            if (id) viewEdges.set(id, [...(viewEdges.get(id) ?? []), s]);
          }
        const svg = Diagram.render("basketApi", {
          drift: true,
          label: (e) => (active?.view ? null : e.label),
          nodeClass: (id) =>
            [P.elements[id].mark ?? "", M.unbuilt.includes(id) ? "unbuilt" : "", lit.includes(id) ? "lit" : ""].join(
              " ",
            ),
          edgeClass: (e) => {
            const cls = [e.mark ?? ""];
            if (active?.edges?.includes(e.id)) cls.push("lit");
            if (viewEdges.has(e.id))
              cls.push(
                "lit step",
                viewEdges.get(e.id).every((s) => trace.untested.includes(s.order)) ? "untested" : "",
              );
            return cls.join(" ");
          },
          decorate: (id, g, box) => {
            const c = M.code[id];
            if (!c) return;
            const w = box.width - 24;
            Diagram.el(
              "rect",
              { x: box.x + 12, y: box.y + box.height - 9, width: w, height: 3, rx: 1.5, class: "heat-track" },
              g,
            );
            Diagram.el(
              "rect",
              {
                x: box.x + 12,
                y: box.y + box.height - 9,
                width: Math.max(3, (w * share(id)) / 63),
                height: 3,
                rx: 1.5,
                class: "heat-bar",
              },
              g,
            );
          },
        });
        if (active) svg.classList.add("focusing");
        // Pins: each note's number, on the first thing it points at.
        const shapes = level.layout.shapes;
        const at = {};
        for (const g of groups)
          for (const note of g.notes) {
            let x, y;
            if (note.edges?.[0] && svg.edges[note.edges[0]] && note.tone === "problem")
              [x, y] = svg.edges[note.edges[0]].mid;
            else if (note.nodes[0]) {
              const b = shapes[note.nodes[0]];
              x = b.x + 2;
              y = b.y + 2;
            } else continue;
            const key = `${Math.round(x)},${Math.round(y)}`;
            const offset = (at[key] = (at[key] ?? -1) + 1);
            const pin = Diagram.el(
              "g",
              { class: `map-pin ${note.tone} ${active === note ? "lit" : ""}` },
              svg.querySelector(".labels"),
            );
            Diagram.el("circle", { cx: x + offset * 22, cy: y, r: 10 }, pin);
            Diagram.text(pin, String(note.n), { x: x + offset * 22, y: y + 4, "text-anchor": "middle" });
          }
        if (active?.view)
          for (const [id, steps] of viewEdges) {
            const { mid } = svg.edges[id];
            steps.forEach((s, i) => {
              const g = Diagram.el(
                "g",
                { class: `map-pin lit ${trace.untested.includes(s.order) ? "problem" : ""}` },
                svg.querySelector(".labels"),
              );
              Diagram.el("circle", { cx: mid[0] + i * 22, cy: mid[1], r: 9 }, g);
              g.querySelector("circle").style.fill = trace.untested.includes(s.order) ? "" : "var(--text)";
              Diagram.text(g, s.order, { x: mid[0] + i * 22, y: mid[1] + 3.5, "text-anchor": "middle" });
            });
          }
        $("stage").replaceChildren(svg);
      }

      function drawNotes() {
        const root = $("notes");
        root.replaceChildren();
        for (const g of groups) {
          const div = add(root, "div", undefined, "group");
          add(div, "h2", g.q);
          add(div, "p", g.a, "answer");
          for (const note of g.notes) {
            const btn = add(div, "button", undefined, `note ${note.tone} ${active === note ? "on" : ""}`);
            add(btn, "span", String(note.n), "pin");
            const body = add(btn, "span");
            add(body, "b", note.title);
            add(body, "p", note.text);
            if (note.more) add(body, "p", note.more, "more");
            if (note.steps && active === note) {
              const ol = add(body, "ol");
              for (const s of view.steps)
                add(
                  ol,
                  "li",
                  `${s.description}${trace.untested.includes(s.order) ? ", no test takes it" : ""}`,
                  trace.untested.includes(s.order) ? "untested" : "",
                );
            }
            btn.onclick = () => {
              active = active === note ? null : note;
              draw();
            };
          }
        }
        add(
          root,
          "p",
          "The six other dynamic views don't change, and their tests take every step. Select a note to see it on the diagram.",
          "quiet",
        );
      }
      function draw() {
        drawNotes();
        drawStage();
      }
      const fromHash = /note=(\d)/.exec(location.hash);
      if (fromHash) active = groups.flatMap((g) => g.notes).find((x) => x.n === Number(fromHash[1]));
      draw();
    </script>
  </body>
</html>
