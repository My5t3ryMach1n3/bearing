<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Round 3, the chosen direction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sea: #0e1822;
        --rail: #12202c;
        --raise: #172838;
        --grid: #1d2d3b;
        --text: #dce6ee;
        --muted: #8da1b3;
        --faint: #788ea1;
        --line: #26394a;
        --node: #13222f;
        --node-line: #56718a;
        --edge: #6d8498;
        --added: #5ed3c3;
        --drift: #ff6b81;
        --heat: #ffb25b;
        --untested: #ffb25b;
        --font: "IBM Plex Sans", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --chrome: #080d12;
        --chrome-line: #1a2530;
        --chrome-hover: #0f1821;
        --chrome-text: #c9d4dd;
        --heat-1: #3b3324;
        --heat-2: #6e5026;
        --heat-3: #b9802f;
        --heat-4: #ffb25b;
        --on-heat: #1c1306;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--sea);
        color: var(--text);
        font: 14px/1.45 var(--font);
        display: grid;
        grid-template-rows: auto auto 1fr;
      }
      button {
        font: inherit;
        color: inherit;
      }

      .title {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 14px;
        padding: 10px 16px 6px;
        background: var(--chrome);
        font-family: var(--mono);
      }
      .title h1 {
        font: 500 14px var(--mono);
        margin: 0;
        color: var(--chrome-text);
      }
      .title h1::before {
        content: "$ ";
        color: var(--faint);
      }
      .title span {
        color: var(--muted);
        font: 12.5px var(--mono);
      }
      .title kbd {
        margin-left: auto;
        color: var(--faint);
        font: 12px var(--mono);
      }

      [role="tablist"] {
        display: flex;
        gap: 0;
        background: var(--chrome);
        border-bottom: 1px solid var(--chrome-line);
        padding: 0 8px;
        overflow-x: auto;
      }
      [role="tab"] {
        all: unset;
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 9px 10px 10px;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      [role="tab"]:hover {
        background: var(--chrome-hover);
      }
      [role="tab"]:focus-visible {
        outline: 2px solid var(--added);
        outline-offset: -2px;
      }
      [role="tab"][aria-selected="true"] {
        border-bottom-color: var(--text);
      }
      .tab-name {
        font: 500 13px var(--mono);
        color: var(--muted);
      }
      [role="tab"][aria-selected="true"] .tab-name {
        color: var(--text);
      }
      .tab-result {
        font: 12px/1 var(--mono);
        padding: 3px 6px;
        border-radius: 2px;
        border: 1px solid var(--chrome-line);
        color: var(--chrome-text);
      }
      [role="tab"].attention .tab-result {
        border-color: rgba(255, 107, 129, 0.45);
        color: var(--drift);
      }
      [role="tab"].quiet .tab-name {
        color: var(--muted);
      }

      .work {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        min-height: 0;
      }
      .map {
        position: relative;
        overflow: auto;
        background-image: radial-gradient(var(--grid) 1px, transparent 1px);
        background-size: 18px 18px;
        display: flex;
        flex-direction: column;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .crumbs {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .crumbs button {
        all: unset;
        cursor: pointer;
      }
      .crumbs button:hover {
        color: var(--text);
        text-decoration: underline;
      }
      .crumbs .here {
        color: var(--text);
        font-weight: 600;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        background: var(--rail);
      }
      .seg button {
        all: unset;
        cursor: pointer;
        padding: 4px 12px;
        font-size: 13.5px;
        color: var(--muted);
      }
      .seg button[aria-pressed="true"] {
        background: var(--line);
        color: var(--text);
      }
      .seg button:focus-visible {
        outline: 2px solid var(--added);
        outline-offset: -2px;
      }
      select {
        background: var(--rail);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 8px;
        font: inherit;
        font-size: 13.5px;
      }
      .ramp {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font: 11.5px var(--mono);
      }
      .ramp span {
        padding: 3px 7px;
        border-radius: 3px;
      }
      .ramp .label {
        font-family: var(--font);
        color: var(--muted);
        padding-right: 8px;
      }
      .canvas {
        flex: 1;
        padding: 6px 24px 24px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .canvas svg {
        display: block;
        width: 100%;
        max-width: calc(var(--natural-width) * 1.15);
        max-height: calc(100vh - 200px);
        height: auto;
      }

      aside {
        background: var(--chrome);
        border-left: 1px solid var(--chrome-line);
        overflow: auto;
        padding: 8px 0 40px;
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .group {
        padding: 0 16px 12px;
      }
      .group h2 {
        font: 500 12px var(--mono);
        color: var(--muted);
        margin: 10px 0 4px;
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--chrome-line);
      }
      .group h2 small {
        font: 12px var(--mono);
        color: var(--faint);
        font-weight: 400;
      }
      .group .sub {
        font: 12px var(--mono);
        color: var(--muted);
        margin: 0 0 6px;
      }
      .item {
        all: unset;
        box-sizing: border-box;
        display: block;
        width: 100%;
        cursor: pointer;
        padding: 5px 8px;
        margin: 0 -8px 1px;
        width: calc(100% + 16px);
        border-radius: 0;
      }
      .item:hover {
        background: var(--chrome-hover);
      }
      .item:focus-visible {
        outline: 2px solid var(--added);
        outline-offset: -2px;
      }
      .item.on {
        background: var(--chrome-hover);
        box-shadow: inset 2px 0 0 var(--text);
      }
      .item-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }
      .item-name {
        font-weight: 500;
        color: var(--chrome-text);
      }
      .item-meta {
        font: 12px var(--mono);
        color: var(--muted);
        white-space: nowrap;
      }
      .item-meta.added {
        color: var(--added);
      }
      .item-meta.drift {
        color: var(--drift);
      }
      .item-meta.heat {
        color: var(--text);
      }
      .item-sub {
        display: block;
        font: 12px var(--mono);
        color: var(--faint);
        overflow-wrap: anywhere;
      }
      .item-more {
        display: none;
        font: 12.5px/1.5 var(--font);
        color: var(--muted);
        margin-top: 6px;
      }
      .item.on .item-more {
        display: block;
      }
      .item-more p {
        margin: 4px 0;
      }
      .item-more ul {
        list-style: none;
        padding: 0;
        margin: 4px 0;
      }
      .item-more li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font: 12px var(--mono);
      }
      .elsewhere {
        color: var(--muted);
      }
      .elsewhere button {
        all: unset;
        cursor: pointer;
        color: var(--text);
        text-decoration: underline;
      }
      .bar-track {
        display: block;
        height: 3px;
        background: var(--chrome-line);
        margin-top: 5px;
      }
      .bar-fill {
        display: block;
        height: 3px;
        background: var(--heat);
      }
      ol.steps {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      ol.steps .item {
        display: grid;
        grid-template-columns: 2em 1fr;
        padding: 3px 8px;
        font: 12.5px var(--mono);
      }
      ol.steps .item span:first-child {
        color: var(--faint);
      }
      ol.steps .untested {
        color: var(--untested);
      }
      .empty {
        padding: 0 18px;
        color: var(--muted);
      }
      .note {
        padding: 0 16px;
        color: var(--faint);
        font-size: 12px;
      }

      .diagram {
        font-family: var(--font);
      }
      .shape {
        fill: var(--node);
        stroke: var(--node-line);
        stroke-width: 1.2;
      }
      .shape-line {
        fill: none;
        stroke: var(--node-line);
      }
      .shape-dot {
        fill: var(--node-line);
      }
      .node-kind,
      .node-tech {
        fill: var(--muted);
        font-size: 11px;
      }
      .node-name {
        fill: var(--text);
        font-size: 13.5px;
        font-weight: 600;
      }
      .node-tech {
        font-family: var(--mono);
        font-size: 10.5px;
      }
      .external .shape {
        stroke-dasharray: 2 3;
        fill: var(--sea);
      }
      .boundary-box {
        fill: none;
        stroke: var(--node-line);
        stroke-dasharray: 1 5;
        stroke-linecap: round;
        stroke-width: 1.5;
      }
      .boundary-name {
        fill: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .edge-line {
        fill: none;
        stroke: var(--edge);
        stroke-width: 1.2;
      }
      .edge-head {
        fill: var(--edge);
      }
      .edge-label text {
        fill: var(--muted);
        font-size: 11px;
      }
      .node {
        cursor: pointer;
      }
      .node,
      .edge,
      .edge-label {
        transition: opacity 0.2s;
      }
      .dim {
        opacity: 0.2;
      }
      .node.selected .shape {
        stroke: var(--text);
        stroke-width: 2.4;
      }
      .node.added .shape {
        stroke: var(--added);
        stroke-width: 2;
      }
      .node.added .node-kind {
        fill: var(--added);
      }
      .node.added.selected .shape {
        stroke-width: 3.2;
      }
      .edge.added .edge-line {
        stroke: var(--added);
        stroke-width: 2;
      }
      .edge.added .edge-head {
        fill: var(--added);
      }
      .edge-label.added text {
        fill: var(--added);
      }
      .edge.changed .edge-line {
        stroke: var(--added);
        stroke-width: 2;
        stroke-dasharray: 2 3;
      }
      .edge.changed .edge-head {
        fill: var(--added);
      }
      .edge-label.changed text {
        fill: var(--added);
      }
      .edge.drift .edge-line {
        stroke: var(--drift);
        stroke-width: 2.4;
      }
      .edge.drift .edge-head {
        fill: var(--drift);
      }
      .edge-label.drift text {
        fill: var(--drift);
        font-weight: 700;
        font-size: 12px;
      }
      .node.unbuilt .shape {
        fill: none;
        stroke-dasharray: 4 4;
      }
      .node.unbuilt text {
        opacity: 0.5;
      }
      .node.heat-1 .shape {
        fill: var(--heat-1);
        stroke: var(--heat-2);
      }
      .node.heat-2 .shape {
        fill: var(--heat-2);
        stroke: var(--heat-3);
      }
      .node.heat-3 .shape {
        fill: var(--heat-3);
        stroke: var(--heat-4);
      }
      .node.heat-4 .shape {
        fill: var(--heat-4);
        stroke: var(--heat-4);
      }
      .node.heat-2 text {
        fill: var(--text) !important;
      }
      .node.heat-3 text,
      .node.heat-4 text {
        fill: var(--on-heat) !important;
      }
      .heat-figure {
        fill: var(--text);
        font: 500 11px var(--mono);
      }
      .inside {
        fill: var(--muted);
        font: 11px var(--mono);
      }
      .inside.added {
        fill: var(--added);
      }
      .inside.drift {
        fill: var(--drift);
      }
      .inside.heat {
        fill: var(--text);
      }
      .edge.step .edge-line {
        stroke: var(--text);
        stroke-width: 1.8;
      }
      .edge.step .edge-head {
        fill: var(--text);
      }
      .edge.step.untested .edge-line {
        stroke: var(--untested);
        stroke-dasharray: 4 4;
      }
      .edge.step.untested .edge-head {
        fill: var(--untested);
      }
      .edge.step.current .edge-line {
        stroke-width: 3.6;
      }
      .badge circle {
        fill: var(--sea);
        stroke: var(--text);
        stroke-width: 1.3;
      }
      .badge text {
        fill: var(--text);
        font: 600 10.5px var(--mono);
      }
      .badge.untested circle {
        stroke: var(--untested);
      }
      .badge.untested text {
        fill: var(--untested);
      }
      .badge.current circle {
        fill: var(--text);
      }
      .badge.current text {
        fill: var(--sea);
      }
      .badge.current.untested circle {
        fill: var(--untested);
        stroke: var(--untested);
      }

      @media (max-width: 860px) {
        body {
          display: block;
        }
        [role="tablist"] {
          grid-template-columns: repeat(2, 1fr);
        }
        .work {
          display: block;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        .canvas {
          padding: 4px 8px 16px;
        }
        .canvas svg {
          max-height: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .node,
        .edge,
        .edge-label {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="title">
      <h1>Share a basket by email</h1>
      <span>#42 share-a-basket @ 3f9c2e1</span>
      <kbd>1–4 switch tabs</kbd>
    </div>
    <div role="tablist" id="tabs" aria-label="Review"></div>
    <div class="work">
      <div class="map">
        <div class="bar">
          <nav class="crumbs" id="crumbs" aria-label="Level"></nav>
          <div class="controls" id="controls"></div>
        </div>
        <div class="canvas" id="canvas"></div>
      </div>
      <aside id="panel" role="tabpanel"></aside>
    </div>

    <script src="../round-1/data.js"></script>
    <script src="../round-1/diagram.js"></script>
    <script>
      const P = window.PAGE,
        M = P.mock;
      const $ = (id) => document.getElementById(id);
      const add = (parent, tag, text, cls) => {
        const n = document.createElement(tag);
        if (text !== undefined && text !== null) n.textContent = text;
        if (cls) n.className = cls;
        parent.appendChild(n);
        return n;
      };
      const E = P.elements;
      const chain = (id) => {
        const out = [];
        for (let at = id; at !== undefined && E[at]; at = E[at].parent) out.unshift(at);
        return out;
      };
      const below = (id) => Object.keys(E).filter((x) => x !== id && chain(x).includes(id));
      const hasLevel = (id) => P.levels.some((l) => l.id === id);
      const levelOf = (id) => P.levels.find((l) => l.id === id);
      // The level where an element is drawn inside its scope: its parent's, or the context for a top-level one.
      const homeLevel = (id) => (E[id].parent && hasLevel(E[id].parent) ? E[id].parent : "context");
      const code = M.code;
      const linesOf = (id) => (code[id] ? code[id].added + code[id].removed : 0);
      const linesIn = (id) => [id, ...below(id)].reduce((s, x) => s + linesOf(x), 0);
      const outsideLines = M.outside.reduce((s, f) => s + f[1] + f[2], 0);
      const total = Object.keys(code).reduce((s, id) => s + linesOf(id), 0) + outsideLines;
      const added = Object.keys(E).filter((id) => E[id].mark === "added");
      const heatBin = (n) => (n === 0 ? 0 : n < 10 ? 1 : n < 50 ? 2 : n < 150 ? 3 : 4);
      const bins = [
        [1, "1–9"],
        [2, "10–49"],
        [3, "50–149"],
        [4, "150+"],
      ];
      const views = P.views.slice().sort((a, b) => (b.mark ? 1 : 0) - (a.mark ? 1 : 0));

      const state = { tab: "design", level: "basketApi", side: "change", selected: null, view: "req-5", step: null };
      const hash = new URLSearchParams(location.hash.slice(1));
      for (const k of ["tab", "level", "view"]) if (hash.get(k)) state[k] = hash.get(k);

      const tabs = [
        { id: "design", name: "Target", result: `+${added.length} ~1`, tone: "" },
        {
          id: "code",
          name: "Code",
          result: `+${Object.values(code).reduce((s, c) => s + c.added, 0) + M.outside.reduce((s, f) => s + f[1], 0)} −${Object.values(code).reduce((s, c) => s + c.removed, 0)}`,
          tone: "",
        },
        { id: "build", name: "Build", result: "1 undeclared", tone: "attention" },
        { id: "behaviour", name: "Behaviour", result: "3 untested", tone: "attention" },
      ];

      const rows0 = () => Object.keys(code).length;
      function heading(parent, text, count) {
        const h = add(parent, "h2", text);
        if (count !== undefined) add(h, "small", String(count));
        return h;
      }
      function select(id) {
        state.selected = state.selected === id ? null : id;
        draw();
      }
      function goTo(level) {
        state.level = level;
        draw();
      }

      function drawTabs() {
        const root = $("tabs");
        root.replaceChildren();
        for (const t of tabs) {
          const b = add(root, "button", undefined, t.tone);
          b.setAttribute("role", "tab");
          b.setAttribute("aria-selected", String(state.tab === t.id));
          add(b, "span", t.name, "tab-name");
          add(b, "span", t.result, "tab-result");
          b.onclick = () => {
            state.tab = t.id;
            state.selected = null;
            state.step = null;
            draw();
          };
        }
      }

      function drawCrumbs() {
        const c = $("crumbs");
        c.replaceChildren();
        const items = [
          ["context", "System context"],
          ...(state.level === "context" ? [] : chain(state.level).map((id) => [id, E[id].name])),
        ];
        items.forEach(([id, name], i) => {
          if (i > 0) add(c, "span", "›");
          if (i === items.length - 1) add(c, "span", name, "here");
          else add(c, "button", name).onclick = () => goTo(id);
        });
      }

      function drawControls() {
        const c = $("controls");
        c.replaceChildren();
        if (state.tab === "design") {
          const seg = add(c, "div", undefined, "seg");
          for (const [k, label] of [
            ["before", "Before"],
            ["change", "Change"],
            ["after", "After"],
          ]) {
            const b = add(seg, "button", label);
            b.setAttribute("aria-pressed", String(state.side === k));
            b.onclick = () => {
              state.side = k;
              draw();
            };
          }
        }
        if (state.tab === "code") {
          const r = add(c, "span", undefined, "ramp");
          add(r, "span", "Lines changed", "label");
          for (const [b, label] of bins) {
            const sw = add(r, "span", label);
            sw.style.background = `var(--heat-${b})`;
            if (b >= 3) sw.style.color = "var(--on-heat)";
          }
        }
        if (state.tab === "behaviour") {
          const s = add(c, "select");
          for (const v of views) {
            const o = add(s, "option", `${v.title}${v.mark ? ", new" : ""}`);
            o.value = v.id;
            o.selected = v.id === state.view;
          }
          s.onchange = () => {
            state.view = s.value;
            state.step = null;
            draw();
          };
        }
      }

      // A finding in the panel, which points at something on the map. When that's on another level, it says where.
      function item(parent, { id, name, meta, metaClass, sub, more, level }) {
        const b = add(parent, "button", undefined, `item ${state.selected === id ? "on" : ""}`);
        const row = add(b, "span", undefined, "item-row");
        add(row, "span", name, "item-name");
        if (meta) add(row, "span", meta, `item-meta ${metaClass ?? ""}`);
        if (sub) add(b, "span", sub, "item-sub");
        if (level && level !== state.level && !levelOf(state.level).nodes.includes(id)) {
          const where = add(b, "span", undefined, "item-sub elsewhere");
          const go = add(where, "button", `${level === "context" ? "System context" : E[level].name} ›`);
          go.onclick = (e) => {
            e.stopPropagation();
            state.selected = id;
            goTo(level);
          };
        }
        const m = add(b, "span", undefined, "item-more");
        more?.(m);
        b.onclick = () => select(id);
        return b;
      }

      function drawPanel() {
        const root = $("panel");
        root.replaceChildren();
        if (state.tab === "design") {
          let g = add(root, "div", undefined, "group");
          heading(g, "Added", added.length);
          for (const id of added)
            item(g, {
              id,
              name: E[id].name,
              meta: E[id].type === "softwareSystem" ? "external" : "component",
              metaClass: "added",
              sub: [E[id].path, M.unbuilt.includes(id) ? "no code yet" : null].filter(Boolean).join("  "),
              level: homeLevel(id),
              more: (m) => add(m, "p", E[id].description),
            });
          g = add(root, "div", undefined, "group");
          heading(g, "Changed", 1);
          item(g, {
            id: "rel:basketApi->database",
            name: "Basket API → Database",
            meta: "1 → 2 rels",
            metaClass: "added",
            level: "basket",
            more: (m) =>
              add(
                m,
                "p",
                "Email outbox now stores queued email in the database, beside the repository's reads and writes.",
              ),
          });
          g = add(root, "div", undefined, "group");
          heading(g, "ADR");
          item(g, {
            id: "adr",
            name: M.adr.title,
            sub: M.adr.path,
            more: (m) => {
              add(m, "p", M.adr.reason);
              add(m, "p", `Alternatives considered: ${M.adr.alternatives}`);
            },
          });
        }
        if (state.tab === "code") {
          const g = add(root, "div", undefined, "group");
          heading(g, "Components", rows0());
          const rows = Object.keys(code).sort((a, b) => linesOf(b) - linesOf(a));
          for (const id of rows) {
            const b = item(g, {
              id,
              name: E[id].name,
              meta: `+${code[id].added} −${code[id].removed}`,
              metaClass: "heat",
              sub: E[id].path,
              level: homeLevel(id),
              more: (m) => {
                const ul = add(m, "ul");
                for (const [path, a, r] of code[id].files) {
                  const li = add(ul, "li");
                  add(li, "span", path.split("/").pop());
                  add(li, "span", `+${a} −${r}`);
                }
              },
            });
            const track = add(b, "span", undefined, "bar-track");
            add(track, "span", undefined, "bar-fill").style.width = `${(100 * linesOf(id)) / total}%`;
          }
          const o = add(root, "div", undefined, "group");
          heading(o, "Outside the model", 1);
          item(o, {
            id: "outside",
            name: "email-template.ts",
            meta: "+46 −0",
            metaClass: "drift",
            sub: "src/basket-api/utils/",
            more: (m) => add(m, "p", "Move it into Basket sharing's folder, or give it a component in the design."),
          });
          add(root, "p", "Email outbox: no code yet", "note");
        }
        if (state.tab === "build") {
          const g = add(root, "div", undefined, "group");
          heading(g, "Undeclared", 1);
          item(g, {
            id: "d0",
            name: "Basket controller → Basket repository",
            meta: "import",
            metaClass: "drift",
            sub: "basket-controller/controller.ts:14",
            level: "basketApi",
            more: (m) => add(m, "p", M.driftAdvice.d0),
          });
          add(root, "p", "Boundaries: 1 undeclared. Deployment: matches.", "note");
        }
        if (state.tab === "behaviour") {
          const view = P.views.find((v) => v.id === state.view);
          const trace = view.id === "req-5" ? M.traces["req-5"] : { untested: [], note: "Its tests take every step." };
          const g = add(root, "div", undefined, "group");
          heading(g, view.title);
          add(g, "p", view.id === "req-5" ? "#5/AC1 stops after step 8" : "every step tested", "sub");
          const ol = add(g, "ol", undefined, "steps");
          for (const s of view.steps) {
            const li = add(ol, "li");
            const b = add(
              li,
              "button",
              undefined,
              `item ${state.step === s.order ? "on" : ""} ${trace.untested.includes(s.order) ? "untested" : ""}`,
            );
            add(b, "span", s.order);
            add(b, "span", `${s.description}`);
            b.title = `${E[s.source].name} → ${E[s.destination].name}`;
            b.onclick = () => {
              state.step = state.step === s.order ? null : s.order;
              draw();
            };
          }
          if (state.level !== view.scope) {
            const p = add(root, "p", undefined, "note elsewhere");
            add(p, "span", "This view is drawn in ");
            add(p, "button", E[view.scope].name).onclick = () => goTo(view.scope);
          }
        }
      }

      function drawMap() {
        const level = levelOf(state.level);
        const tab = state.tab;
        const sel = state.selected;
        const view = P.views.find((v) => v.id === state.view);
        const trace = view.id === "req-5" ? M.traces["req-5"] : { untested: [] };
        const stepsOn = new Map();
        if (tab === "behaviour" && state.level === view.scope)
          for (const s of view.steps) {
            const e = Diagram.stepEdge(state.level, s);
            if (e) stepsOn.set(e.id, [...(stepsOn.get(e.id) ?? []), s]);
          }
        const inView = new Set(view.steps.flatMap((s) => [s.source, s.destination]));
        const containsAdded = (id) => below(id).some((x) => E[x].mark === "added");
        const edgeClass = (e) => {
          if (tab === "design") {
            if (state.side === "before") return e.mark === "added" ? "hidden" : "";
            if (e.mark) return e.mark;
            return state.side === "change" ? "dim" : "";
          }
          if (tab === "build") return e.drift ? "drift" : "dim";
          if (tab === "behaviour") {
            const steps = stepsOn.get(e.id);
            if (!steps) return "dim";
            return `step ${steps.every((s) => trace.untested.includes(s.order)) ? "untested" : ""} ${steps.some((s) => s.order === state.step) ? "current" : ""}`;
          }
          return "dim";
        };
        const svg = Diagram.render(state.level, {
          drift: tab === "build",
          include: tab === "design" && state.side === "before" ? level.nodes.filter((id) => E[id].inBefore) : undefined,
          edgeFilter: (e) => edgeClass(e) !== "hidden",
          edgeClass,
          label: (e) => (tab === "behaviour" || /dim/.test(edgeClass(e)) ? null : e.label),
          nodeClass: (id) => {
            const cls = [];
            if (M.unbuilt.includes(id)) cls.push("unbuilt");
            if (sel === id) cls.push("selected");
            if (tab === "design" && state.side !== "before") {
              if (E[id].mark === "added") cls.push("added");
              else if (state.side === "change" && !containsAdded(id)) cls.push("dim");
            }
            if (tab === "code" && heatBin(linesIn(id))) cls.push(`heat-${heatBin(linesIn(id))}`);
            if (
              tab === "build" &&
              !level.drift.some((d) => d.source === id || d.destination === id) &&
              !(level.scope === undefined ? false : below(id).length && false)
            )
              cls.push(level.drift.length ? "dim" : "");
            if (tab === "behaviour" && state.level === view.scope && !inView.has(id)) cls.push("dim");
            if (tab === "behaviour" && state.level !== view.scope && id !== view.scope) cls.push("dim");
            return cls.join(" ");
          },
          decorate: (id, g, box) => {
            g.addEventListener("click", () => (hasLevel(id) ? goTo(id) : select(id)));
            const x = box.x + box.width - 8,
              y = box.y + 15;
            // What sits inside an element with a level of its own, for this tab.
            if (hasLevel(id)) {
              let text = null,
                cls = "";
              if (tab === "design" && state.side !== "before" && containsAdded(id)) {
                text = `+${below(id).filter((b) => E[b].mark === "added").length} inside ›`;
                cls = "added";
              }
              if (tab === "build" && P.levels.some((l) => l.drift.length && chain(l.id).includes(id))) {
                text = "1 inside ›";
                cls = "drift";
              }
              if (tab === "code" && linesIn(id) > 0) {
                text = `${linesIn(id)} inside ›`;
                cls = "heat";
              }
              if (text) Diagram.text(g, text, { x, y, class: `inside ${cls}`, "text-anchor": "end" });
            }
            if (tab === "code" && linesIn(id) > 0) {
              if (code[id])
                Diagram.text(g, `+${code[id].added} −${code[id].removed}`, {
                  x,
                  y,
                  class: "heat-figure",
                  "text-anchor": "end",
                });
            }
          },
        });
        if (stepsOn.size) {
          for (const [id, steps] of stepsOn) {
            const { mid } = svg.edges[id];
            steps.forEach((s, i) => {
              const cls = `badge ${trace.untested.includes(s.order) ? "untested" : ""} ${state.step === s.order ? "current" : ""}`;
              const g = Diagram.el("g", { class: cls }, svg.querySelector(".labels"));
              Diagram.el("circle", { cx: mid[0] + i * 22, cy: mid[1], r: 9 }, g);
              Diagram.text(g, s.order, { x: mid[0] + i * 22, y: mid[1] + 3.5, "text-anchor": "middle" });
            });
          }
        }
        $("canvas").replaceChildren(svg);
      }

      function draw() {
        drawTabs();
        drawCrumbs();
        drawControls();
        drawPanel();
        drawMap();
        history.replaceState(
          null,
          "",
          `#tab=${state.tab}&level=${state.level}${state.tab === "behaviour" ? `&view=${state.view}` : ""}`,
        );
      }
      document.addEventListener("keydown", (e) => {
        if (e.target.closest("select") || e.metaKey || e.ctrlKey || e.altKey) return;
        const t = tabs[Number(e.key) - 1];
        if (t) {
          state.tab = t.id;
          state.selected = null;
          state.step = null;
          draw();
        }
      });
      draw();
    </script>
  </body>
</html>
