apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chairside
  namespace: chairside
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: booking-api, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
