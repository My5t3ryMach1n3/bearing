apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: chairside
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/chairside/web:1.4.0
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: chairside
spec:
  selector: { app: web }
  ports: [{ port: 80 }]
