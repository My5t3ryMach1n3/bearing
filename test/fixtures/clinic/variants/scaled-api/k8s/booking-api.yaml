apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-api
  namespace: chairside
data:
  DATABASE_HOST: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
  namespace: chairside
spec:
  replicas: 3
  selector:
    matchLabels: { app: booking-api }
  template:
    metadata:
      labels: { app: booking-api }
    spec:
      containers:
        - name: booking-api
          image: ghcr.io/chairside/booking-api:2.1.0
          envFrom: [{ configMapRef: { name: booking-api } }]
          ports: [{ containerPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: booking-api
  namespace: chairside
spec:
  selector: { app: booking-api }
  ports: [{ port: 8000 }]
