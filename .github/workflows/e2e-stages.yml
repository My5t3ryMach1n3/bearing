name: E2E stages

# Opens the next Shelf scenario stage as an issue once the Bearing issues it needs are closed.
on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: e2e-stages

jobs:
  unlock:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.issue.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node e2e/unlock-stages.mjs
        env:
          GH_TOKEN: ${{ github.token }}
