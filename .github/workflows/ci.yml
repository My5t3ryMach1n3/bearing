name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Install the packed tarball globally, as a user would from npm, and run the bin from outside the repo.
      - name: Smoke-test a global install
        run: |
          npm pack
          npm install -g ./bearing-cli-*.tgz
          cd "$RUNNER_TEMP"
          bearing --version
          bearing --help

  # Converts the fixture DSLs with the real Structurizr, once per runner, and logs how long one conversion takes.
  structurizr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runner: [docker, java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: matrix.runner == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The .war is 220 MB; its file name carries the version, so a stale one from an older key is harmless.
      - if: matrix.runner == 'java'
        uses: actions/cache@v4
        with:
          path: ~/.cache/bearing/structurizr-*.war
          key: structurizr-war-${{ hashFiles('src/structurizr.ts') }}
          restore-keys: structurizr-war-
      - run: npm ci
      - run: npx vitest run test/structurizr.integration.test.ts --reporter=verbose
        env:
          BEARING_STRUCTURIZR_RUNNER: ${{ matrix.runner }}
