# The conformance job's steps, for a `pull_request` workflow that has checked out the PR's head with its history and
# installed the project's dependencies. It runs the PR's code, so it needs no secrets and only a read-only token. It
# re-derives everything: no as-built model, trace or test result the branch commits is used. The job fails if the
# target is invalid or a blocking check fails, and that result is `bearing/conformance`. The comment and check results
# are uploaded for the `workflow_run` job in actions/report to post, since this job's token can't write to a fork's PR.
# Last, for a PR from this repo that leaves Bearing's workflows and config alone, it builds the architecture page and
# uploads it unzipped, for the report job to link. See the GitHub Action section of docs/product-spec.md.
name: Bearing conformance
description: Validate the target, run the traced tests, derive the as-built model, check it and write the PR comment.

inputs:
  base:
    description: The branch the PR merges into, whose current target it's checked against.
    default: ${{ github.base_ref }}
  token:
    description: A read-only token, for reading the requirement issues.
    default: ${{ github.token }}
  retention-days:
    description: >-
      How many days to keep the architecture page, from 1 to the repository's limit. Defaults to the repository's
      artifact retention, 90 days unless changed.
    default: ""

runs:
  using: composite
  steps:
    # The Bearing this action was tagged with, from its own package.json.
    - name: Install Bearing
      shell: bash
      run: |
        version="$(node -p 'require(process.argv[1]).version' "$GITHUB_ACTION_PATH/../../package.json")"
        npm install --prefix "$RUNNER_TEMP/bearing-cli" --no-save --no-audit --no-fund "bearing-cli@$version"
        echo "$RUNNER_TEMP/bearing-cli/node_modules/.bin" >> "$GITHUB_PATH"
        mkdir -p "$RUNNER_TEMP/bearing/report"
        # Traces the branch commits are never read: `bearing test` writes its own.
        rm -rf .bearing/traces
    # A failing test isn't the job's failure on its own: Criteria coverage reports it against its criterion.
    - name: bearing test
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: bearing test
    - name: bearing derive
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: bearing derive > "$RUNNER_TEMP/bearing/report/as-built.json"
    # Target valid is one of its checks, run on the target the PR is checked against: main's current target, unless the
    # PR changes it. The model the branch has on disk is stale once a target change merges after it forked.
    - id: check
      name: bearing check
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BASE: ${{ inputs.base }}
      run: |
        bearing check --base "origin/$BASE" --json > "$RUNNER_TEMP/bearing/report/check.json"
    - name: bearing report
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BASE: ${{ inputs.base }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        dir="$RUNNER_TEMP/bearing/report"
        echo "$PR" > "$dir/pr"
        bearing report --base "origin/$BASE" --check "$dir/check.json" --site "$RUNNER_TEMP/bearing/site" > "$dir/comment.md"
        cat "$dir/comment.md" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: bearing-report
        path: ${{ runner.temp }}/bearing/report/
        if-no-files-found: warn
    - uses: actions/upload-artifact@v4
      with:
        name: bearing-site
        path: ${{ runner.temp }}/bearing/site/
        if-no-files-found: ignore
    # The architecture page, built from the checks' results above, never failing the job. Only for a PR from this repo,
    # and not for one that changes Bearing's workflows or config, which would build it with the workflow it changes.
    # `bearing post` checks both again itself before it links the page, since this job runs the PR's code.
    - id: page
      name: bearing page
      if: github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BASE: ${{ inputs.base }}
      run: |
        changed="$(git diff --name-only --no-renames "origin/$BASE...HEAD" -- .github/workflows .bearing ':!.bearing/claims')"
        if [ -n "$changed" ]; then
          echo "No architecture page: this PR changes Bearing's workflows or config:"
          echo "$changed"
          exit 0
        fi
        page="$RUNNER_TEMP/bearing/page/bearing-architecture.html"
        mkdir -p "$(dirname "$page")"
        bearing page --base "origin/$BASE" --check "$RUNNER_TEMP/bearing/report/check.json" --out "$page"
        echo "path=$page" >> "$GITHUB_OUTPUT"
    # Unzipped, so the artifact is the HTML file itself, and its link opens the page in the browser.
    - if: steps.page.outputs.path != ''
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.page.outputs.path }}
        archive: false
        retention-days: ${{ inputs.retention-days }}
    - name: Result
      shell: bash
      env:
        CHECK: ${{ steps.check.outcome }}
      run: |
        if [ "$CHECK" != success ]; then echo "::error::A blocking check failed: see bearing check above."; fi
        [ "$CHECK" = success ]
